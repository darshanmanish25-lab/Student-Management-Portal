<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Register &middot; VSB ECE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="masthead">
    <div class="masthead__title">
      <h1>Student Register</h1>
      <p>V.S.B. Engineering College &middot; Department roll book</p>
    </div>
    <button id="openAddBtn" class="btn btn--primary">Add student</button>
  </header>

  <main class="register">

    <div class="toolbar">
      <div class="toolbar__search">
        <input id="searchInput" type="text" placeholder="Search by name or roll number" autocomplete="off" />
      </div>
      <div class="toolbar__filters">
        <select id="departmentFilter">
          <option value="">All departments</option>
        </select>
        <select id="yearFilter">
          <option value="">All years</option>
          <option value="1">Year 1</option>
          <option value="2">Year 2</option>
          <option value="3">Year 3</option>
          <option value="4">Year 4</option>
        </select>
      </div>
      <div class="toolbar__count" id="recordCount">0 records</div>
    </div>

    <div id="statusBanner" class="status-banner" hidden></div>

    <div class="table-wrap">
      <table class="ledger">
        <thead>
          <tr>
            <th>Roll No.</th>
            <th>Name</th>
            <th>Department</th>
            <th>Year</th>
            <th>CGPA</th>
            <th>Email</th>
            <th>Phone</th>
            <th class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="studentTableBody">
          <!-- rows injected by script.js -->
        </tbody>
      </table>

      <div id="emptyState" class="empty-state" hidden>
        <p class="empty-state__title">The register is empty</p>
        <p class="empty-state__body">Add your first student to begin tracking records.</p>
      </div>
    </div>
  </main>

  <!-- Slide-over panel: Add / Edit -->
  <div id="overlay" class="overlay" hidden></div>
  <aside id="formPanel" class="form-panel" hidden aria-hidden="true">
    <form id="studentForm" novalidate>
      <div class="form-panel__header">
        <h2 id="formPanelTitle">Add student</h2>
        <button type="button" id="closePanelBtn" class="icon-btn" aria-label="Close">&times;</button>
      </div>

      <input type="hidden" id="studentId" />

      <div class="field">
        <label for="rollNo">Roll number <span class="req">*</span></label>
        <input id="rollNo" name="roll_no" type="text" required />
        <p class="field__error" data-error-for="roll_no"></p>
      </div>

      <div class="field">
        <label for="name">Full name <span class="req">*</span></label>
        <input id="name" name="name" type="text" required />
        <p class="field__error" data-error-for="name"></p>
      </div>

      <div class="field field--row">
        <div>
          <label for="department">Department <span class="req">*</span></label>
          <input id="department" name="department" type="text" placeholder="e.g. ECE" required />
        </div>
        <div>
          <label for="year">Year <span class="req">*</span></label>
          <select id="year" name="year" required>
            <option value="">Select</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>
      </div>
      <p class="field__error" data-error-for="department"></p>
      <p class="field__error" data-error-for="year"></p>

      <div class="field">
        <label for="cgpa">CGPA</label>
        <input id="cgpa" name="cgpa" type="number" step="0.01" min="0" max="10" placeholder="0.00 - 10.00" />
        <p class="field__error" data-error-for="cgpa"></p>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="name@example.com" />
        <p class="field__error" data-error-for="email"></p>
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" placeholder="10-digit number" />
        <p class="field__error" data-error-for="phone"></p>
      </div>

      <div class="form-panel__footer">
        <button type="button" id="cancelBtn" class="btn btn--ghost">Cancel</button>
        <button type="submit" id="submitBtn" class="btn btn--primary">Save student</button>
      </div>
    </form>
  </aside>

  <!-- Delete confirmation -->
  <div id="confirmOverlay" class="overlay" hidden></div>
  <div id="confirmDialog" class="confirm-dialog" hidden>
    <p id="confirmMessage">Remove this student from the register?</p>
    <div class="confirm-dialog__actions">
      <button type="button" id="confirmCancelBtn" class="btn btn--ghost">Cancel</button>
      <button type="button" id="confirmDeleteBtn" class="btn btn--danger">Delete</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
